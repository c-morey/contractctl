# GENERATED by contractctl from the contracts in data_products/sales.
# Do not edit: change the contracts or contractctl.yml and run `contractctl generate`.
resources:
  pipelines:
    sales_data_products:
      name: sales-data-products
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      continuous: false
      libraries:
      - file:
          path: ../../generated/pipelines/sales/bronze/orders_raw.sql
      - file:
          path: ../../generated/pipelines/sales/silver/orders.sql
      - file:
          path: ../../generated/pipelines/sales/gold/daily_revenue.sql
      configuration:
        contracts.catalog: ${var.catalog}
        contracts.landing: /Volumes/${var.catalog}/bronze/landing
      event_log:
        catalog: ${var.catalog}
        schema: governance
        name: sales_pipeline_event_log
      notifications:
      - email_recipients:
        - ${var.platform_alert_email}
        alerts:
        - on-update-failure
        - on-update-fatal-failure
        - on-flow-failure
  jobs:
    sales_data_contracts:
      name: sales-data-contracts
      description: Enforce, publish and verify the data contracts of the sales domain
      max_concurrent_runs: 1
      tasks:
      - task_key: run_sales_pipeline
        description: Ingest, cast, enforce expectations, quarantine, build gold
        pipeline_task:
          pipeline_id: ${resources.pipelines.sales_data_products.id}
      - task_key: govern_orders
        description: Registry, tags, certification and grants for urn:datacontract:sales:orders v1.0.0
        depends_on:
        - task_key: run_sales_pipeline
        sql_task:
          warehouse_id: ${var.warehouse_id}
          file:
            path: ../../generated/governance/sales/orders.sql
            source: WORKSPACE
          parameters:
            catalog: ${var.catalog}
            git_commit: ${bundle.git.commit}
        email_notifications:
          on_failure:
          - ${var.platform_alert_email}
          - orders-data@example.com
      - task_key: verify_orders
        description: SLA and table-level checks for urn:datacontract:sales:orders v1.0.0; fails on breach
        depends_on:
        - task_key: govern_orders
        sql_task:
          warehouse_id: ${var.warehouse_id}
          file:
            path: ../../generated/sla/sales/orders.sql
            source: WORKSPACE
          parameters:
            catalog: ${var.catalog}
            run_id: '{{task.run_id}}'
        email_notifications:
          on_failure:
          - ${var.platform_alert_email}
          - orders-data@example.com
      - task_key: govern_daily_revenue
        description: Registry, tags, certification and grants for urn:datacontract:sales:daily_revenue v1.0.0
        depends_on:
        - task_key: run_sales_pipeline
        sql_task:
          warehouse_id: ${var.warehouse_id}
          file:
            path: ../../generated/governance/sales/daily_revenue.sql
            source: WORKSPACE
          parameters:
            catalog: ${var.catalog}
            git_commit: ${bundle.git.commit}
        email_notifications:
          on_failure:
          - ${var.platform_alert_email}
          - sales-analytics@example.com
      - task_key: verify_daily_revenue
        description: SLA and table-level checks for urn:datacontract:sales:daily_revenue v1.0.0; fails on breach
        depends_on:
        - task_key: govern_daily_revenue
        sql_task:
          warehouse_id: ${var.warehouse_id}
          file:
            path: ../../generated/sla/sales/daily_revenue.sql
            source: WORKSPACE
          parameters:
            catalog: ${var.catalog}
            run_id: '{{task.run_id}}'
        email_notifications:
          on_failure:
          - ${var.platform_alert_email}
          - sales-analytics@example.com
      trigger:
        periodic:
          interval: 1
          unit: HOURS
      email_notifications:
        on_failure:
        - ${var.platform_alert_email}
